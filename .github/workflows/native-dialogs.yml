# Runs the dialog probe through macOS's native handler (sheets from edit-sharp-gui/Tools/MacOS/dialogs.m)
# and uploads its screenshots, so the dialogs can be checked without a Mac.
name: Native dialogs

on:
  workflow_dispatch:
  push:
    branches: [macos-dialogs]
    paths:
      - "edit-sharp-gui/**"
      - ".github/workflows/native-dialogs.yml"

env:
  GODOT_VERSION: 4.7.2
  GODOT: godot/Godot_mono.app/Contents/MacOS/Godot

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # EditSharp at the branch of the same name when it has one, so the two can change together
      - name: Pick the EditSharp branch
        id: editsharp
        run: |
          if git ls-remote --exit-code --heads https://github.com/EditSharp/EditSharp.git "${GITHUB_REF_NAME}" > /dev/null; then
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          repository: EditSharp/EditSharp
          ref: ${{ steps.editsharp.outputs.ref }}
          path: EditSharp

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          mkdir godot && unzip -q godot.zip -d godot
          "$GODOT" --version

      - name: Build the macOS natives
        run: sh edit-sharp-gui/Tools/MacOS/build.sh

      - name: Build
        run: dotnet build "edit-sharp-gui/EditSharp GUI.csproj" -p:UseLocalEditSharp=true "-p:EditSharpProject=$GITHUB_WORKSPACE/EditSharp/EditSharp.csproj"

      # the first import pass can log resources it has not reached yet; the second is clean
      - name: Import project
        run: |
          "$GODOT" --headless --path edit-sharp-gui --import || true
          "$GODOT" --headless --path edit-sharp-gui --import

      - name: Dialog probe (dark)
        timeout-minutes: 5
        run: |
          perl -e 'alarm 180; exec @ARGV' "$GITHUB_WORKSPACE/$GODOT" --rendering-method gl_compatibility --path edit-sharp-gui res://Tools/Scenes/Tests/DialogProbe.tscn 2>&1 | tee dialog-probe-dark.log | grep -E "PROBE|DIALOGS|ERROR" || true
          grep -q "^DIALOGS OK" dialog-probe-dark.log

      - name: Dialog probe (light)
        if: always()
        timeout-minutes: 5
        run: |
          perl -e 'alarm 180; exec @ARGV' "$GITHUB_WORKSPACE/$GODOT" --rendering-method gl_compatibility --path edit-sharp-gui res://Tools/Scenes/Tests/DialogProbe.tscn -- --palette=res://Themes/Light.tres 2>&1 | tee dialog-probe-light.log | grep -E "PROBE|DIALOGS|ERROR" || true
          grep -q "^DIALOGS OK" dialog-probe-light.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-dialogs-macos
          path: |
            ~/Library/Application Support/Godot/app_userdata/EditSharp GUI/probe-dialog-*.png
            dialog-probe-*.log
          if-no-files-found: warn
